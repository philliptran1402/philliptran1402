name: Update Profile

# README.md là nguồn sự thật — sửa trực tiếp file đó.
# Workflow này CHỈ làm mới dòng "Last updated", không ghi đè nội dung.
#
# (Bản cũ nhúng toàn bộ README vào một heredoc bên trong `run: |`. Cách đó vừa
# làm YAML không parse được — nên Action ngừng chạy — vừa xoá sạch mọi chỉnh sửa
# tay trên README mỗi ngày. Thêm nữa heredoc dùng << 'EOF' nên ${CURRENT_DATE}
# bị ghi nguyên văn thay vì thay bằng ngày thật.)

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Refresh "Last updated" timestamp
        run: |
          CURRENT_DATE=$(TZ='Asia/Ho_Chi_Minh' date +'%Y-%m-%d %H:%M %Z')
          if grep -q '^Last updated: ' README.md; then
            sed -i "s/^Last updated: .*/Last updated: ${CURRENT_DATE}/" README.md
          else
            printf '\n---\n\nLast updated: %s\n' "$CURRENT_DATE" >> README.md
          fi

      - name: Commit if changed
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git add README.md
          git diff --staged --quiet && echo "Khong co thay doi" && exit 0
          git commit -m "chore: refresh profile timestamp"
          git push
